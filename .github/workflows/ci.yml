name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test (scraper parsing + venues.json sanity)
        run: go test ./...

      - name: Generated templ files are up to date
        run: |
          go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          templ generate
          git diff --exit-code -- templates/

      - name: Inline JS in docs/index.html parses
        run: |
          mkdir -p /tmp/js
          python3 - <<'PY'
          import re
          html = open('docs/index.html').read()
          for i, js in enumerate(re.findall(r'<script>(.*?)</script>', html, re.S)):
              open(f'/tmp/js/s{i}.js', 'w').write(js)
          PY
          for f in /tmp/js/*.js; do node --check "$f"; done
