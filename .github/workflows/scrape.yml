name: Weekly Scrape

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 6am UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # apt's chromium-browser is a snap shim that fails intermittently
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate templ files
        run: |
          # Pin the CLI to go.mod's templ runtime; @latest generated incompatible code
          go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          templ generate

      - name: Build scraper
        run: go build -o bin/scraper ./cmd/scraper/main.go

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./bin/scraper

      - name: Build generator
        run: go build -o bin/generate ./cmd/generate/main.go

      - name: Run generator
        run: ./bin/generate

      - name: Commit updated data and static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update venue data and static site [skip ci]"
            git push
          fi

      - name: Open issue for scrape failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"scrape_failed": true' data/venues.json; then
            FAILED=$(jq -r '.[] | select(.scrape_failed == true) | .name' data/venues.json | paste -sd ', ')
            gh issue create \
              --title "Scrape failure: ${FAILED}" \
              --body "The weekly scraper failed for the following venues: **${FAILED}**. Please investigate." \
              --label "scrape-failure" || true
          fi

      - name: Open issue if the scrape job itself failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly scrape job failed" \
            --body "The Weekly Scrape workflow crashed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "scrape-failure" || true
